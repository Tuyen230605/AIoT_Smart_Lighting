# Hub biên chạy trên Raspberry Pi 5. Mỗi năng lực là một container,
# giao tiếp thuần qua MQTT nội bộ. Ranh giới này chính là thứ cho phép
# thực hiện các thí nghiệm bóc tách (docs/05-evaluation.md) bằng cách
# tắt một service, mà không phải sửa dòng mã nào.
name: oi

services:
  broker:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports: ["1883:1883"]
    volumes:
      - ./config/mosquitto:/mosquitto/config:ro
      - mosquitto_data:/mosquitto/data

  state:                      # nguồn sự thật duy nhất về trạng thái
    build: { context: ., dockerfile: services/oi_state/Dockerfile }
    restart: unless-stopped
    depends_on: [broker]
    env_file: [.env]
    volumes: ["oi_data:/data"]

  asr:                        # AI-2 · giọng nói → chữ
    build: { context: ., dockerfile: services/oi_asr/Dockerfile }
    restart: unless-stopped
    depends_on: [broker]
    env_file: [.env]
    ports: ["5005:5005/udp"]  # nhận luồng PCM từ node khi leo thang
    volumes: ["models:/models"]

  agent:                      # AI-3 · ý định → lệnh
    build: { context: ., dockerfile: services/oi_agent/Dockerfile }
    restart: unless-stopped
    depends_on: [broker, state]
    env_file: [.env]
    volumes: ["models:/models"]

  vision:                     # AI-4, AI-5 · người ở đâu, đang làm gì
    build: { context: ., dockerfile: services/oi_vision/Dockerfile }
    restart: unless-stopped
    depends_on: [broker]
    env_file: [.env]
    devices: ["/dev/video0:/dev/video0"]
    volumes: ["models:/models"]

  context:                    # hợp nhất radar + thị giác + lux + giờ
    build: { context: ., dockerfile: services/oi_context/Dockerfile }
    restart: unless-stopped
    depends_on: [broker]
    env_file: [.env]

  policy:                     # AI-6 · học mức sáng ưa thích
    build: { context: ., dockerfile: services/oi_policy/Dockerfile }
    restart: unless-stopped
    depends_on: [broker, state]
    env_file: [.env]
    volumes: ["oi_data:/data"]

  tts:                        # AI-8 · phản hồi bằng tiếng nói (mở rộng)
    build: { context: ., dockerfile: services/oi_tts/Dockerfile }
    restart: unless-stopped
    depends_on: [broker]
    env_file: [.env]
    volumes: ["models:/models"]
    profiles: ["extended"]    # docker compose --profile extended up

  nodered:
    image: nodered/node-red:latest
    restart: unless-stopped
    depends_on: [broker]
    ports: ["1880:1880"]
    volumes: ["./config/nodered:/data"]

volumes:
  mosquitto_data:
  oi_data:
  models:
