# Mosquitto — kênh liên lạc DUY NHẤT của hệ thống (ADR 0003 + 0004).
# Không có broker nào khác, không có đường ra đám mây nào.
#
# HAI LISTENER, HAI LOẠI CLIENT
#   1883  MQTT thường  → ba node ESP32 và các dịch vụ trong Docker
#   9001  WebSocket    → trình duyệt, để dashboard nói thẳng với broker
#                        mà không cần viết backend nào (xem hub/ui/)
#
# Cổng 8883 (TLS) sẽ thêm khi đã sinh chứng chỉ — xem docs/07-security.md.
# Chứng chỉ đó nạp vào node bằng tools/provision/provision_node.py.

listener 1883
protocol mqtt

listener 9001
protocol websockets

# ══════════════════════════════════════════════════════════════
#  Xác thực
#
#  allow_anonymous false là bắt buộc: một broker mở trong mạng gia đình
#  nghĩa là bất kỳ thiết bị nào trong nhà cũng bật tắt được đèn và đọc
#  được toàn bộ telemetry.
#
#  Tạo file mật khẩu (chạy một lần, trên máy có docker):
#    docker run --rm -it -v "$PWD/hub/config/mosquitto:/m" eclipse-mosquitto:2 \
#      mosquitto_passwd -c -b /m/passwd node   MAT_KHAU_NODE
#    docker run --rm -it -v "$PWD/hub/config/mosquitto:/m" eclipse-mosquitto:2 \
#      mosquitto_passwd -b /m/passwd svc    MAT_KHAU_DICH_VU
#    docker run --rm -it -v "$PWD/hub/config/mosquitto:/m" eclipse-mosquitto:2 \
#      mosquitto_passwd -b /m/passwd ui     MAT_KHAU_DASHBOARD
#
#  File passwd đã nằm trong .gitignore — KHÔNG BAO GIỜ commit nó.
# ══════════════════════════════════════════════════════════════
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice

# Bản tin retain là cơ chế để một client vừa vào biết ngay trạng thái
# hiện tại mà không phải hỏi ai. Giữ mặc định (bật).
max_queued_messages 1000
