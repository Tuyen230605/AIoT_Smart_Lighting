server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Trang nhỏ và đổi thường xuyên trong lúc phát triển — không cache.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Thư viện có gắn phiên bản trong ảnh Docker nên cache thoải mái.
    location /vendor/ {
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
