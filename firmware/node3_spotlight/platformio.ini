; Node 3 — ESP32 Spotlight (đèn rọi pan/tilt bám người) — GIAI ĐOẠN 4
[platformio]
extra_configs = secrets.ini

[env:esp32dev]
; Ghim phiên bản: để trần thì mỗi lần build lấy bản mới nhất. espressif32 8.0.0
; làm hỏng bước dịch thư viện Edge Impulse (thiếu dsps_fft2r_platform.h), trong
; khi 7.1.2 là bản CI đã build xanh ngày 09/09/2026. Số đo trong báo cáo cũng
; phải truy được về đúng một bộ công cụ.
platform  = espressif32@7.1.2
board     = esp32dev
framework = arduino

monitor_speed = 115200

build_flags =
    ${secrets.build_flags}
    -D CORE_DEBUG_LEVEL=3
    -I ../common/include
    -Wall

lib_deps =
    madhephaestus/ESP32Servo@^3.0.5
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4
