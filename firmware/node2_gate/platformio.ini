; Node 2 — ESP32 Radar Gate Controller (tự động hoá cục bộ)
[platformio]
extra_configs = secrets.ini

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time

build_flags =
    ${secrets.build_flags}
    -D CORE_DEBUG_LEVEL=3
    -I ../common/include
    -Wall

lib_deps =
    ncmreynolds/ld2410@^0.1.3
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4

check_tool  = cppcheck
check_flags = cppcheck: --enable=warning,style --inline-suppr
