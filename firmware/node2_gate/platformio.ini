; Node 2 — ESP32 Radar Gate Controller (tự động hoá cục bộ)
[platformio]
extra_configs = secrets.ini

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time

build_flags =
    ${secrets.build_flags}
    -D CORE_DEBUG_LEVEL=3
    -I ../common/include
    -Wall

lib_deps =
    ncmreynolds/ld2410@^0.1.3
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4
    ; Thư viện có sẵn trong framework. Phải khai báo tường minh vì bộ dò phụ
    ; thuộc của PlatformIO chỉ quét thư mục src/, không quét ../common/include.
    Preferences
    ArduinoOTA
    ESPmDNS
    Update

check_tool  = cppcheck
check_flags = cppcheck: --enable=warning,style --inline-suppr

; ── Nạp qua Wi-Fi (G1.7) ──────────────────────────────────────
; Sau lần nạp đầu tiên bằng cáp, đặt OTA_PASSWORD trong secrets.ini rồi nạp
; không dây bằng:  pio run -t upload --upload-port <ip-cua-node>
; Bỏ ghi chú hai dòng dưới để lấy espota làm mặc định.
; upload_protocol = espota
; upload_flags    = --auth=<đúng chuỗi đã đặt ở OTA_PASSWORD>
