; Node 1 — ESP32-S3 Edge AI Controller (lớp phản xạ)
[platformio]
extra_configs = secrets.ini

[env:esp32-s3-devkitc-1]
; Ghim phiên bản: để trần thì mỗi lần build lấy bản mới nhất. espressif32 8.0.0
; làm hỏng bước dịch thư viện Edge Impulse (thiếu dsps_fft2r_platform.h), trong
; khi 7.1.2 là bản CI đã build xanh ngày 09/09/2026. Số đo trong báo cáo cũng
; phải truy được về đúng một bộ công cụ.
platform  = espressif32@7.1.2
board     = esp32-s3-devkitc-1
framework = arduino

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time

board_upload.flash_size        = 16MB
board_build.partitions         = partitions.csv
board_build.flash_mode         = qio
board_build.arduino.memory_type = qio_opi

build_flags =
    ${secrets.build_flags}
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=3
    -I ../common/include          ; oi_protocol.h, oi_state.h dùng chung
    -Wall

lib_deps =
    adafruit/Adafruit VEML7700 Library
    adafruit/Adafruit BusIO
    adafruit/Adafruit Unified Sensor
    fastled/FastLED
    knolleary/PubSubClient
    bblanchon/ArduinoJson@^7.0.4
    ; Thư viện có sẵn trong framework. Phải khai báo tường minh vì bộ dò phụ
    ; thuộc của PlatformIO chỉ quét thư mục src/, không quét ../common/include.
    Preferences
    ArduinoOTA
    ESPmDNS
    Update

check_tool  = cppcheck
check_flags = cppcheck: --enable=warning,style --inline-suppr

; ── Nạp qua Wi-Fi (G1.7) ──────────────────────────────────────
; Sau lần nạp đầu tiên bằng cáp, đặt OTA_PASSWORD trong secrets.ini rồi nạp
; không dây bằng:  pio run -t upload --upload-port <ip-cua-node>
; Bỏ ghi chú hai dòng dưới để lấy espota làm mặc định.
; upload_protocol = espota
; upload_flags    = --auth=<đúng chuỗi đã đặt ở OTA_PASSWORD>
